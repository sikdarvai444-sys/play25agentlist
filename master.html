<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAY25 Agent List</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#0b3d91;color:#fff}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 8px}
.logo{font-size:24px;font-weight:bold;text-align:center;flex:1}
.logo span:first-child{color:#ffeb3b}
.search-icon,.grid-icon{font-size:20px;color:#ffc107;cursor:pointer;padding:5px}
.menu{background:#1153c7;margin:8px;border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.menu a{color:#fff;text-decoration:none;font-size:12px;font-weight:500}
.menu a.active{color:#ffeb3b;border-bottom:2px solid #ffeb3b}
.box{background:#1153c7;margin:8px;border-radius:8px;padding:10px;overflow-x:auto}
h2{text-align:center;color:#ffeb3b;margin-bottom:10px;font-size:18px;font-weight:bold}

/* কম্প্যাক্ট টেবিল */
table{width:100%;border-collapse:collapse;font-size:10px;min-width:650px}
thead{background:#0b3d91}
th{color:#fff;padding:6px 3px;text-align:center;font-weight:bold;white-space:nowrap}
td{padding:5px 3px;text-align:center;border-bottom:1px solid #1976d2;vertical-align:middle}

.avatar{width:28px;height:28px;border-radius:50%;background:#555;display:inline-block;vertical-align:middle;margin-right:3px}
.avatar img{width:100%;border-radius:50%}
.name-col{text-align:left;white-space:nowrap}
.name-col b{font-size:11px}
.name-col small{font-size:9px;color:#ccc;display:block}
.id-box{background:#cddc39;color:#000;padding:2px 4px;border-radius:4px;font-weight:bold;font-size:9px;display:inline-block}
.stars{color:#ffc107;font-size:9px;white-space:nowrap}
.btn-wa{background:#25D366;color:#fff;padding:2px 4px;border-radius:3px;text-decoration:none;font-size:9px;display:block;margin:1px 0}
.btn-report{background:#f44336;color:#fff;padding:2px 5px;border-radius:4px;text-decoration:none;font-size:9px}
.btn-view{background:#2196f3;color:#fff;padding:2px 5px;border-radius:4px;text-decoration:none;font-size:12px}
.icon-wa{width:18px}
.icon-fb{width:18px}

.support-btn{position:fixed;bottom:10px;left:10px;background:#4caf50;padding:8px 16px;border-radius:25px;color:#fff;text-decoration:none;font-weight:bold;display:flex;align-items:center;gap:5px;z-index:99;border:none;cursor:pointer;font-size:12px}

/* Popup CSS */
.popup-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:999;justify-content:center;align-items:center}
.popup{background:#1153c7;width:90%;max-width:400px;border-radius:10px;padding:15px;position:relative}
.popup h3{background:#000;padding:10px;border-radius:5px;text-align:center;color:#ffeb3b;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:5px}
.close-btn{position:absolute;top:10px;right:15px;font-size:24px;color:#fff;cursor:pointer}
.popup label{color:#ffeb3b;font-size:13px;margin-top:8px;display:block}
.popup select,.popup input{width:100%;padding:8px;margin:5px 0;border-radius:5px;border:none;background:#0b3d91;color:#fff}
.popup button{background:#4caf50;color:#fff;padding:8px 15px;border:none;border-radius:5px;font-weight:bold;cursor:pointer;float:right;margin-top:10px}
.support-item{display:flex;align-items:center;gap:10px;background:#0b3d91;padding:10px;border-radius:8px;margin-bottom:8px}
.support-item.icon{width:35px;height:35px;background:#ffc107;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:bold}
.support-item.info{flex:1}
.support-item.btn-msg{background:#4caf50;color:#fff;padding:5px 10px;border-radius:5px;text-decoration:none;font-size:12px}
</style>
</head>
<body>

<div class="header">
    <div class="search-icon" onclick="openSearch()">🔍</div>
    <div class="logo">👑 <span>PLAY</span><span>25</span><div style="font-size:10px;letter-spacing:2px">Agent List</div></div>
    <div class="grid-icon">⊞</div>
</div>

<div class="menu">
    <a href="index.html">🏠 Home</a>
    <a href="siteowner.html">👤 Site Owner</a>
    <a href="admin.html">👤 Admin</a>
    <a href="subadmin.html">👤 Sub Admin</a>
    <a href="super.html">👤 Super</a>
    <a href="master.html">👤 Master</a>
    <a href="#">🎯 Lottery</a>
</div>

<div class="box">
    <h2 id="roleTitle">MASTER LIST</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th><th>ID</th><th>Rating</th><th>App</th><th>FB</th><th>Phone</th><th>View</th><th>Report</th>
            </tr>
        </thead>
        <tbody id="agentList"><tr><td colspan="8">Loading...</td></tr></tbody>
    </table>
</div>

<button class="support-btn" onclick="openSupport()">🎧 Support</button>

<!-- Search Popup -->
<div class="popup-overlay" id="searchPopup">
  <div class="popup">
    <span class="close-btn" onclick="closeSearch()">&times;</span>
    <h3>👤 এজেন্ট খুঁজুন</h3>
    <label>Type</label>
    <select id="searchType">
      <option value="all">All Agent</option>
      <option value="Site Owner">Site Owner</option>
      <option value="Admin">Admin</option>
      <option value="Sub Admin">Sub Admin</option>
      <option value="Super">Super</option>
      <option value="Master">Master</option>
    </select>
    <label>Search By Agent ID</label>
    <input type="text" id="searchId" placeholder="Agent ID Number">
    <label>Search by Whatsapp</label>
    <input type="text" id="searchPhone" placeholder="Phone Number">
    <button onclick="doSearch()">Search</button>
  </div>
</div>

<!-- Support Popup -->
<div class="popup-overlay" id="supportPopup">
  <div class="popup">
    <span class="close-btn" onclick="closeSupport()">&times;</span>
    <h3>🎧 Support Team</h3>
    <div id="supportList">Loading...</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {apiKey: "AIzaSyAwTPtmSGvThVxDM7uc-ey-SjD4500KJeI",authDomain: "play25agent.firebaseapp.com",databaseURL: "https://play25agent-default-rtdb.asia-southeast1.firebasedatabase.app",projectId: "play25agent"};
firebase.initializeApp(firebaseConfig);const db = firebase.database();let allAgentsData = {};

let fileName = window.location.pathname.split("/").pop().replace('.html','');
let currentRole = fileName == ''? 'index' : fileName;
const roleNames = {'index': 'ALL AGENT LIST', 'siteowner': 'SITE OWNER LIST', 'admin': 'ADMIN LIST','subadmin': 'SUB ADMIN LIST', 'super': 'SUPER LIST', 'master': 'MASTER LIST'}
document.getElementById('roleTitle').innerText = roleNames[currentRole] || 'AGENT LIST';
document.querySelectorAll('.menu a').forEach(a=>{if(a.getAttribute('href').includes(currentRole)) a.classList.add('active')})

function openSearch(){document.getElementById('searchPopup').style.display='flex'}
function closeSearch(){document.getElementById('searchPopup').style.display='none'}
function openSupport(){document.getElementById('supportPopup').style.display='flex'}
function closeSupport(){document.getElementById('supportPopup').style.display='none'}

// Agents Load
db.ref('agents').on('value', snap => {
  allAgentsData = snap.val() || {};
  renderAgents(allAgentsData);
})

function renderAgents(data){
  let html = '';
  for(let key in data){
    let a = data[key];
    if(currentRole == 'index' || a.role.toLowerCase().replace(' ','') == currentRole){
      html += `<tr>
        <td class="name-col"><div class="avatar"></div> <b>${a.name}</b><small>${a.role}</small></td>
        <td><div class="id-box">${a.id}</div></td>
        <td class="stars">★★★</td>
        <td><a href="${a.app||'#'}" target="_blank">${a.app? '📱' : '--'}</a></td>
        <td><a href="${a.fb||'#'}" target="_blank">${a.fb? 'f' : '--'}</a></td>
        <td>${a.phone? `<a href="https://wa.me/${a.phone}" class="btn-wa">${a.phone}</a>` : ''}${a.phone2? `<a href="https://wa.me/${a.phone2}" class="btn-wa">${a.phone2}</a>` : ''}</td>
        <td><a href="#" class="btn-view">👁️</a></td>
        <td><a href="#" class="btn-report">Report</a></td>
      </tr>`
    }
  }
  document.getElementById('agentList').innerHTML = html || '<tr><td colspan="8">কোন Agent নেই</td></tr>';
}

// Search Function
function doSearch(){
  let type = document.getElementById('searchType').value;
  let id = document.getElementById('searchId').value.trim();
  let phone = document.getElementById('searchPhone').value.trim();
  let result = {};
  for(let key in allAgentsData){
    let a = allAgentsData[key];
    let match = true;
    if(type!= 'all' && a.role!= type) match = false;
    if(id!= '' &&!a.id.includes(id)) match = false;
    if(phone!= '' &&!a.phone.includes(phone) &&!(a.phone2 && a.phone2.includes(phone))) match = false;
    if(match) result[key] = a;
  }
  renderAgents(result);
  closeSearch();
}

// Support Load
db.ref('support').on('value', snap => {
  let html = '';
  snap.forEach(child => {
    let s = child.val();
    html += `<div class="support-item">
      <div class="icon">🎧</div>
      <div class="info"><b>${s.name}</b><br><small>${s.phone}</small></div>
      <a href="https://wa.me/${s.phone}" class="btn-msg" target="_blank">Message</a>
    </div>`
  })
  document.getElementById('supportList').innerHTML = html || 'কোন Support নেই';
})
</script>
</body></html>
