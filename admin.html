<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Play25</title>
    <style>
        body { 
            background: linear-gradient(135deg, #1e3c72, #2a5298); 
            color:white; 
            font-family: Arial;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: rgba(0,0,0,0.4);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background: #38bdf8;
            color: #1e3c72;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #0ea5e9;
        }
        a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Admin Panel</h1>
        <p>Agent List ম্যানেজ করুন</p>
        
        <input type="text" placeholder="Agent Name লিখুন">
        <input type="text" placeholder="Agent ID লিখুন">
        <button>Add Agent</button>
        
        <br><br>
        <a href="index.html">← Home এ ফিরে যান</a>
    </div>
</body>
</html>
