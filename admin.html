<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN PANEL - PLAY25</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a1a3f;color:#fff;padding:10px}
.header{background:#1e3c72;padding:15px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.header a{color:#ffd700;text-decoration:none;font-weight:bold}
.box{background:#1e3c72;padding:15px;border-radius:10px;margin:10px 0}
input,button{width:100%;padding:10px;margin:5px 0;border-radius:5px;border:none;font-size:15px}
button{background:#28a745;color:#fff;font-weight:bold;cursor:pointer}
table{width:100%;background:#0a1a3f;margin-top:10px;border-collapse:collapse}
td,th{padding:8px;border:1px solid #2a4a8a;font-size:12px;text-align:left}
.btn-del{background:#dc3545;padding:4px 8px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
    <h2>👑 PLAY25 ADMIN PANEL</h2>
    <a href="index.html">← Back to Site</a>
</div>

<div class="box">
<h3>➕ Agent Add</h3>
<input id="name" placeholder="Agent Name">
<input id="id" placeholder="Agent ID">
<input id="phone" placeholder="WhatsApp Number 8801...">
<button onclick="addAgent()">Add Agent</button>
</div>

<div class="box">
<h3>📋 Agent List</h3>
<table id="agentTable"><tr><th>Name</th><th>ID</th><th>Phone</th><th>Action</th></tr></table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAwTPtmSGvThVxDM7uc-ey-SjD4500KJeI",
  authDomain: "play25agent.firebaseapp.com",
  databaseURL: "https://play25agent-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "play25agent"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function addAgent(){
  if(document.getElementById('name').value == ''){alert('Name লিখেন');return;}
  db.ref('agents').push({
    name:document.getElementById('name').value,
    id:document.getElementById('id').value,
    phone:document.getElementById('phone').value
  });
  document.getElementById('name').value = '';
  document.getElementById('id').value = '';
  document.getElementById('phone').value = '';
  alert('Agent Added!')
}

db.ref('agents').on('value', snap => {
  let table = document.getElementById('agentTable');
  table.innerHTML = '<tr><th>Name</th><th>ID</th><th>Phone</th><th>Action</th></tr>';
  snap.forEach(child => {
    let a = child.val();
    table.innerHTML += `<tr>
      <td>${a.name}</td><td>${a.id}</td><td>${a.phone}</td>
      <td><button class="btn-del" onclick="db.ref('agents/${child.key}').remove()">Delete</button></td>
    </tr>`
  })
})
</script>
</body>
</html>
