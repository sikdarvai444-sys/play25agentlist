<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN PANEL - PLAY25</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#0b3d91;color:#fff;padding:10px}
.box{background:#1153c7;padding:15px;border-radius:10px;margin-bottom:10px}
h2,h3{color:#ffeb3b;text-align:center;margin-bottom:10px}
.back{color:#ffeb3b;text-decoration:none;display:inline-block;margin-bottom:10px}
input,select,button{width:100%;padding:10px;margin:5px 0;border-radius:5px;border:none;font-size:14px}
button{background:#4caf50;color:#fff;font-weight:bold;cursor:pointer}
.btn-del{background:#f44336;padding:5px 8px;font-size:12px;width:auto}
.btn-edit{background:#ffc107;color:#000;padding:5px 8px;font-size:12px;width:auto;margin-right:5px}
table{width:100%;font-size:11px;border-collapse:collapse;background:#0b3d91;border-radius:5px;overflow:hidden}
th{background:#1153c7;color:#ffeb3b;padding:8px;text-align:left}
td{padding:8px;border-bottom:1px solid #1976d2}
.tabs{display:flex;gap:10px;margin-bottom:10px}
.tab{flex:1;text-align:center;padding:8px;background:#0b3d91;border-radius:5px;cursor:pointer}
.tab.active{background:#4caf50}
.tab-content{display:none}
.tab-content.active{display:block}
</style>
</head>
<body>

<div class="box">
<h2>👑 ADMIN PANEL</h2>
<a href="index.html" class="back">← Back to Site</a>

<div class="tabs">
  <div class="tab active" onclick="openTab('links')">Links</div>
  <div class="tab" onclick="openTab('agent')">Agent</div>
  <div class="tab" onclick="openTab('support')">Support</div>
</div>

<!-- LINKS TAB -->
<div id="links" class="tab-content active">
  <h3>🔗 Facebook Links</h3>
  <input id="fbGroup" placeholder="Facebook Group Link">
  <input id="fbPage" placeholder="Facebook Page Link">
  <button onclick="saveSettings()">Save FB Links</button>

  <h3 style="margin-top:20px">🔗 Proxy Links Add করুন</h3>
  <input id="p_name" placeholder="Link Name ex: Main Link, Link 2">
  <input id="p_url" placeholder="Link URL ex: https://play25.live">
  <button onclick="addProxy()">Add Proxy Link</button>
  <h3 style="margin-top:20px">📋 All Proxy Links</h3>
  <table id="proxyList"><tr><th>Name</th><th>URL</th><th>Action</th></tr></table>
</div>

<!-- AGENT TAB -->
<div id="agent" class="tab-content">
  <h3 id="formTitle">➕ Agent Add করুন</h3>
  <input type="hidden" id="editKey">
  <input id="name" placeholder="Agent Name *">
  <input id="id" placeholder="Agent ID/Number * ex: 1, 2, 3">
  <input id="serial" placeholder="Serial Number * ex: 101, 102">
  <select id="parent">
    <option value="">-- কার আন্ডারে -- Site Owner</option>
  </select>
  <input id="phone" placeholder="WhatsApp Number 8801... *">
  <input id="phone2" placeholder="2nd WhatsApp Number Optional">
  <input id="app" placeholder="App Download Link">
  <input id="fb" placeholder="Facebook Profile Link">
  <select id="role">
    <option value="">-- Role Select করুন --</option>
    <option value="Site Owner">Site Owner</option>
    <option value="Admin">Admin</option>
    <option value="Sub Admin">Sub Admin</option>
    <option value="Super">Super</option>
    <option value="Master">Master</option>
  </select>
  <button id="saveBtn" onclick="save()">Save Agent</button>
  <button onclick="resetForm()" style="background:#607d8b">Clear</button>

  <h3 style="margin-top:20px">📋 All Agents</h3>
  <div style="overflow-x:auto">
  <table id="list">
    <tr><th>SL</th><th>Name</th><th>Role</th><th>ID</th><th>Parent</th><th>Phone</th><th>Action</th></tr>
  </table>
  </div>
</div>

<!-- SUPPORT TAB -->
<div id="support" class="tab-content">
  <h3>🎧 Support Add করুন</h3>
  <input id="s_name" placeholder="Support Name ex: CS 1, CS 2">
  <input id="s_phone" placeholder="Support WhatsApp 8801...">
  <button onclick="addSupport()">Add Support</button>
  <h3 style="margin-top:20px">📞 All Support</h3>
  <table id="supportList"><tr><th>Name</th><th>Phone</th><th>Action</th></tr></table>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAwTPtmSGvThVxDM7uc-ey-SjD4500KJeI",
  authDomain: "play25agent.firebaseapp.com",
  databaseURL: "https://play25agent-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "play25agent"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let editingKey = null;
let allAgents = {};

function openTab(tabName){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'))
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'))
  document.querySelector(`.tab[onclick="openTab('${tabName}')"]`).classList.add('active')
  document.getElementById(tabName).classList.add('active')
}

// ===== LINKS =====
function saveSettings(){db.ref('settings/fbGroup').set(document.getElementById('fbGroup').value);db.ref('settings/fbPage').set(document.getElementById('fbPage').value);alert('FB Links Saved!')}
db.ref('settings').on('value', snap=>{let s=snap.val()||{};document.getElementById('fbGroup').value=s.fbGroup||'';document.getElementById('fbPage').value=s.fbPage||''})
function addProxy(){let data={name:document.getElementById('p_name').value.trim(),url:document.getElementById('p_url').value.trim()};if(data.name==''||data.url==''){alert('Name, URL দিন');return;}db.ref('settings/proxyLinks').push(data);document.getElementById('p_name').value='';document.getElementById('p_url').value='';}
function delProxy(key){if(confirm('Delete করবেন?'))db.ref('settings/proxyLinks/'+key).remove();}
db.ref('settings/proxyLinks').on('value',snap=>{let h='<tr><th>Name</th><th>URL</th><th>Action</th></tr>';snap.forEach(c=>{let p=c.val();h+=`<tr><td><b>${p.name}</b></td><td>${p.url}</td><td><button class="btn-del" onclick="delProxy('${c.key}')">Del</button></td></tr>`});document.getElementById('proxyList').innerHTML=h})

// ===== AGENT =====
function loadParentDropdown(){
  let h='<option value="">-- Site Owner --</option>';
  for(let key in allAgents){
    let a = allAgents[key];
    h+=`<option value="${a.name} - ${a.role}">${a.name} - ${a.role}</option>`
  }
  document.getElementById('parent').innerHTML = h;
}

function save(){
  let data = {
    name:document.getElementById('name').value.trim(),
    id:document.getElementById('id').value.trim(),
    serial:document.getElementById('serial').value.trim(),
    parent:document.getElementById('parent').value,
    phone:document.getElementById('phone').value.trim(),
    phone2:document.getElementById('phone2').value.trim(),
    app:document.getElementById('app').value.trim(),
    fb:document.getElementById('fb').value.trim(),
    role:document.getElementById('role').value
  };
  if(data.name=='' || data.id=='' || data.serial=='' || data.phone=='' || data.role==''){
    alert('Name, ID, Serial, Phone, Role দিতেই হবে');return;
  }
  if(editingKey){
    db.ref('agents/'+editingKey).update(data);
    alert('Agent Updated!');
  } else {
    db.ref('agents').push(data);
    alert('Agent Added!');
  }
  resetForm();
}

function edit(key, data){
  editingKey = key;
  document.getElementById('formTitle').innerText = '✏️ Agent Edit করুন';
  document.getElementById('saveBtn').innerText = 'Update Agent';
  document.getElementById('name').value = data.name;
  document.getElementById('id').value = data.id;
  document.getElementById('serial').value = data.serial || '';
  document.getElementById('parent').value = data.parent || '';
  document.getElementById('phone').value = data.phone;
  document.getElementById('phone2').value = data.phone2 || '';
  document.getElementById('app').value = data.app || '';
  document.getElementById('fb').value = data.fb || '';
  document.getElementById('role').value = data.role;
  window.scrollTo(0,0);
}

function del(key){ if(confirm('Agent Delete করবেন?')) db.ref('agents/'+key).remove(); }

function resetForm(){
  editingKey = null;
  document.getElementById('formTitle').innerText = '➕ Agent Add করুন';
  document.getElementById('saveBtn').innerText = 'Save Agent';
  ['name','id','serial','phone','phone2','app','fb','role'].forEach(id=>document.getElementById(id).value = '');
  document.getElementById('parent').value = '';
}

db.ref('agents').on('value', snap => {
  allAgents = snap.val() || {};
  loadParentDropdown();
  let h='<tr><th>SL</th><th>Name</th><th>Role</th><th>ID</th><th>Parent</th><th>Phone</th><th>Action</th></tr>';
  snap.forEach(c=>{
    let a=c.val();
    h+=`<tr>
      <td><b>${a.serial || '-'}</b></td>
      <td><b>${a.name}</b></td>
      <td>${a.role}</td>
      <td>${a.id}</td>
      <td>${a.parent || 'Site Owner'}</td>
      <td>${a.phone}</td>
      <td><button class="btn-edit" onclick='edit("${c.key}",${JSON.stringify(a).replace(/"/g,'&quot;')})'>Edit</button><button class="btn-del" onclick="del('${c.key}')">Del</button></td>
    </tr>`
  });
  document.getElementById('list').innerHTML=h
})

// ===== SUPPORT =====
function addSupport(){let data={name:document.getElementById('s_name').value.trim(),phone:document.getElementById('s_phone').value.trim()};if(data.name==''||data.phone==''){alert('Name, Phone দিন');return;}db.ref('support').push(data);alert('Support Added!');document.getElementById('s_name').value='';document.getElementById('s_phone').value='';}
function delSupport(key){if(confirm('Support Delete করবেন?'))db.ref('support/'+key).remove();}
db.ref('support').on('value',snap=>{let h='<tr><th>Name</th><th>Phone</th><th>Action</th></tr>';snap.forEach(c=>{let s=c.val();h+=`<tr><td><b>${s.name}</b></td><td>${s.phone}</td><td><button class="btn-del" onclick="delSupport('${c.key}')">Del</button></td></tr>`});document.getElementById('supportList').innerHTML=h})
</script>
</body></html>
