<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN PANEL - PLAY25</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#0b3d91;color:#fff;padding:10px}
.box{background:#1153c7;padding:15px;border-radius:10px;margin-bottom:10px}
h2,h3{color:#ffeb3b;text-align:center;margin-bottom:10px}
.back{color:#ffeb3b;text-decoration:none;display:inline-block;margin-bottom:10px}
input,select,button{width:100%;padding:10px;margin:5px 0;border-radius:5px;border:none;font-size:14px}
button{background:#4caf50;color:#fff;font-weight:bold;cursor:pointer}
.btn-del{background:#f44336;padding:5px 8px;font-size:12px;width:auto}
.btn-edit{background:#ffc107;color:#000;padding:5px 8px;font-size:12px;width:auto;margin-right:5px}

/* TABLE */
table{width:100%;font-size:11px;border-collapse:collapse;background:#0b3d91;border-radius:5px;overflow:hidden}
th{background:#1153c7;color:#ffeb3b;padding:8px;text-align:left}
td{padding:8px;border-bottom:1px solid #1976d2;vertical-align:middle}

/* ORGINAL WA ICON */
.wa-icon{width:20px;height:20px;display:inline-block;vertical-align:middle;background:#25D366;border-radius:50%;padding:3px}
.wa-icon svg{width:100%;height:100%;fill:#fff}
.btn-none{color:#888}

.tabs{display:flex;gap:10px;margin-bottom:10px}
.tab{flex:1;text-align:center;padding:8px;background:#0b3d91;border-radius:5px;cursor:pointer}
.tab.active{background:#4caf50}
.tab-content{display:none}
.tab-content.active{display:block}
.parent-group{display:none}
label{color:#ffeb3b;font-size:13px;margin-top:5px;display:block}
</style>
</head>
<body>

<div class="box">
<h2>👑 ADMIN PANEL</h2>
<a href="index.html" class="back">← Back to Site</a>

<div class="tabs">
  <div class="tab active" onclick="openTab('links')">Links</div>
  <div class="tab" onclick="openTab('agent')">Agent</div>
  <div class="tab" onclick="openTab('support')">Support</div>
</div>

<!-- LINKS TAB -->
<div id="links" class="tab-content active">
  <h3>🔗 Facebook Links</h3>
  <input id="fbGroup" placeholder="Facebook Group Link">
  <input id="fbPage" placeholder="Facebook Page Link">
  <button onclick="saveSettings()">Save FB Links</button>
  <h3 style="margin-top:20px">🔗 Proxy Links</h3>
  <input id="p_name" placeholder="Link Name ex: Main Link">
  <input id="p_url" placeholder="Link URL">
  <button onclick="addProxy()">Add Proxy Link</button>
  <table id="proxyList" style="margin-top:10px"><tr><th>Name</th><th>URL</th><th>Del</th></tr></table>
</div>

<!-- AGENT TAB -->
<div id="agent" class="tab-content">
  <h3 id="formTitle">➕ Agent Add করুন</h3>
  <input type="hidden" id="editKey">
  <input id="name" placeholder="Agent Name *">
  <input id="id" placeholder="Agent ID/Number * ex: 1, 2, 3">

  <label>Role Select করুন *</label>
  <select id="role" onchange="loadParentDropdown()">
    <option value="">-- Role Select করুন --</option>
    <option value="Site Owner">Site Owner</option>
    <option value="Admin">Admin</option>
    <option value="Sub Admin">Sub Admin</option>
    <option value="Super">Super</option>
    <option value="Master">Master</option>
  </select>

  <div id="parentBox" class="parent-group">
    <label>কার আন্ডারে *</label>
    <select id="parent" onchange="setParentId()"></select>
  </div>

  <input id="parentId" placeholder="Parent এর ID Number" readonly>

  <input id="phone" placeholder="WhatsApp Number 6011... *">
  <input id="fb" placeholder="Facebook Profile Link">

  <button id="saveBtn" onclick="save()">Save Agent</button>
  <button onclick="resetForm()" style="background:#607d8b">Clear</button>

  <h3 style="margin-top:20px">📋 All Agents</h3>
  <div style="overflow-x:auto">
  <table id="list"><tr><th>SL</th><th>Name</th><th>Role</th><th>ID</th><th>App</th><th>Parent</th><th>Phone</th><th>Action</th></tr></table>
  </div>
</div>

<!-- SUPPORT TAB -->
<div id="support" class="tab-content">
  <h3>🎧 Support Add করুন</h3>
  <input id="s_name" placeholder="Support Name">
  <input id="s_phone" placeholder="Support WhatsApp 6011...">
  <button onclick="addSupport()">Add Support</button>
  <table id="supportList" style="margin-top:10px"><tr><th>Name</th><th>Phone</th><th>App</th><th>Del</th></tr></table>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {apiKey: "AIzaSyAwTPtmSGvThVxDM7uc-ey-SjD4500KJeI",authDomain: "play25agent.firebaseapp.com",databaseURL: "https://play25agent-default-rtdb.asia-southeast1.firebasedatabase.app",projectId: "play25agent"};
firebase.initializeApp(firebaseConfig);const db = firebase.database();
let editingKey = null;let allAgents = {};

// Hierarchy: উপরের Role এর আন্ডারে নিচের Role থাকবে
const hierarchy = {
  "Admin": "Site Owner",
  "Sub Admin": "Admin",
  "Super": "Sub Admin",
  "Master": "Super"
};

// নাম্বার থেকে WA লিংক
function getWaLink(num){
    if(!num) return '';
    let clean = num.replace(/[^0-9]/g,'');
    return `https://wa.me/${clean}`;
}

function openTab(tabName){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.querySelector(`.tab[onclick="openTab('${tabName}')"]`).classList.add('active');document.getElementById(tabName).classList.add('active')}

// PARENT DROPDOWN + ID AUTO SET
function loadParentDropdown(){
  let selectedRole = document.getElementById('role').value;
  let parentBox = document.getElementById('parentBox');
  let parentSelect = document.getElementById('parent');

  if(selectedRole == '' || selectedRole == 'Site Owner'){
    parentBox.style.display = 'none';
    document.getElementById('parentId').value = '';
    return;
  }
  parentBox.style.display = 'block';
  let requiredParentRole = hierarchy[selectedRole];

  let h = `<option value="">-- ${requiredParentRole} Select করুন --</option>`;
  for(let key in allAgents){
    let a = allAgents[key];
    if(a.role == requiredParentRole){
      h+=`<option value="${a.name}" data-id="${a.id}" data-key="${key}">${a.name} - ID:${a.id}</option>`
    }
  }
  parentSelect.innerHTML = h;
  document.getElementById('parentId').value = '';
}

function setParentId(){
  let sel = document.getElementById('parent');
  let selectedOption = sel.options[sel.selectedIndex];
  document.getElementById('parentId').value = selectedOption.getAttribute('data-id') || '';
}

// AGENT SAVE
function save(){
  let data = {
    name:document.getElementById('name').value.trim(),
    id:document.getElementById('id').value.trim(),
    role:document.getElementById('role').value,
    parent:document.getElementById('parent').value,
    parentId:document.getElementById('parentId').value,
    phone:document.getElementById('phone').value.trim(),
    fb:document.getElementById('fb').value.trim()
  };
  if(data.name=='' || data.id=='' || data.phone=='' || data.role==''){
    alert('Name, ID, Phone, Role দিতেই হবে');return;
  }
  if(data.role!= 'Site Owner' && data.parent == ''){alert('কার আন্ডারে Select করুন');return;}

  if(editingKey){db.ref('agents/'+editingKey).update(data);alert('Agent Updated!');}
  else {db.ref('agents').push(data);alert('Agent Added!');}
  resetForm();
}

function edit(key, data){
  editingKey = key;
  document.getElementById('formTitle').innerText = '✏️ Agent Edit করুন';
  document.getElementById('saveBtn').innerText = 'Update Agent';
  document.getElementById('name').value = data.name;
  document.getElementById('id').value = data.id;
  document.getElementById('role').value = data.role;
  loadParentDropdown();
  setTimeout(()=>{document.getElementById('parent').value = data.parent || '';document.getElementById('parentId').value = data.parentId || '';},100)
  document.getElementById('phone').value = data.phone;
  document.getElementById('fb').value = data.fb || '';
  window.scrollTo(0,0);
}

function del(key){if(confirm('Agent Delete করবেন?'))db.ref('agents/'+key).remove();}
function resetForm(){
  editingKey=null;document.getElementById('formTitle').innerText='➕ Agent Add করুন';document.getElementById('saveBtn').innerText='Save Agent';
  ['name','id','parent','parentId','phone','fb'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('role').value='';document.getElementById('parentBox').style.display='none';
}

db.ref('agents').on('value', snap => {
  allAgents = snap.val() || {};
  loadParentDropdown();
  const waSvg = `<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.271.296-1.043 1.02-1.043 2.488 0 1.467 1.068 2.885 1.217 3.084.149.199 2.105 3.213 5.1 4.506.714.309 1.27.492 1.705.63.716.227 1.368.195 1.882.118.574-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.273-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-8.56c-.148-.266-.54-.437-.918-.539-.378-.103-2.242-1.105-2.59-1.231-.348-.126-.602-.189-.852.189-.25.378-.962 1.231-1.18 1.482-.218.25-.436.28-.813.094-.378-.187-1.594-.587-3.037-1.875-1.125-1.004-1.885-2.243-2.103-2.62-.218-.377-.026-.58.166-.77.163-.162.357-.422.54-.634.184-.214.245-.38.367-.634.121-.254.06-.475-.03-.669-.09-.193-.813-1.959-1.114-2.682-.292-.71-.588-.613-.813-.625-.214-.012-.459-.012-.708-.012-.247 0-.65.092-.99.441-.34.349-1.295 1.265-1.295 3.081s1.327 3.58 1.512 3.828c.184.248 2.615 3.992 6.338 5.596.886.383 1.578.613 2.116.784.889.283 1.698.243 2.336.147.714-.106 2.194-.897 2.502-1.764.307-.868.307-1.612.215-1.768"/></svg>`;

  let h='<tr><th>SL</th><th>Name</th><th>Role</th><th>ID</th><th>App</th><th>Parent</th><th>Phone</th><th>Action</th></tr>';
  let i=1;
  snap.forEach(c=>{
    let a=c.val();
    let parentInfo = a.parent? `${a.parent} (ID:${a.parentId})` : 'Site Owner';
    let appLink = a.phone? `<a href="${getWaLink(a.phone)}" target="_blank" class="wa-icon">${waSvg}</a>` : `<span class="btn-none">-</span>`;

    h+=`<tr><td><b>${i++}</b></td><td><b>${a.name}</b></td><td>${a.role}</td><td>${a.id}</td><td>${appLink}</td><td>${parentInfo}</td><td>${a.phone}</td><td><button class="btn-edit" onclick='edit("${c.key}",${JSON.stringify(a).replace(/"/g,'&quot;')})'>Edit</button><button class="btn-del" onclick="del('${c.key}')">Del</button></td></tr>`
  });
  document.getElementById('list').innerHTML=h
})

// LINKS + SUPPORT
function saveSettings(){db.ref('settings/fbGroup').set(document.getElementById('fbGroup').value);db.ref('settings/fbPage').set(document.getElementById('fbPage').value);alert('Saved!')}
db.ref('settings').on('value',s=>{let d=s.val()||{};document.getElementById('fbGroup').value=d.fbGroup||'';document.getElementById('fbPage').value=d.fbPage||''})
function addProxy(){let data={name:document.getElementById('p_name').value,url:document.getElementById('p_url').value};db.ref('settings/proxyLinks').push(data);document.getElementById('p_name').value='';document.getElementById('p_url').value='';}
function delProxy(key){db.ref('settings/proxyLinks/'+key).remove();}
db.ref('settings/proxyLinks').on('value',s=>{let h='<tr><th>Name</th><th>URL</th><th>Del</th></tr>';s.forEach(c=>{let p=c.val();h+=`<tr><td>${p.name}</td><td>${p.url}</td><td><button class="btn-del" onclick="delProxy('${c.key}')">Del</button></td></tr>`});document.getElementById('proxyList').innerHTML=h})

function addSupport(){let data={name:document.getElementById('s_name').value,phone:document.getElementById('s_phone').value};db.ref('support').push(data);document.getElementById('s_name').value='';document.getElementById('s_phone').value='';}
function delSupport(key){db.ref('support/'+key).remove();}
db.ref('support').on('value',s=>{
  const waSvg = `<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.271.296-1.043 1.02-1.043 2.488 0 1.467 1.068 2.885 1.217 3.084.149.199 2.105 3.213 5.1 4.506.714.309 1.27.492 1.705.63.716.227 1.368.195 1.882.118.574-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.273-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-8.56c-.148-.266-.54-.437-.918-.539-.378-.103-2.242-1.105-2.59-1.231-.348-.126-.602-.189-.852.189-.25.378-.962 1.231-1.18 1.482-.218.25-.436.28-.813.094-.378-.187-1.594-.587-3.037-1.875-1.125-1.004-1.885-2.243-2.103-2.62-.218-.377-.026-.58.166-.77.163-.162.357-.422.54-.634.184-.214.245-.38.367-.634.121-.254.06-.475-.03-.669-.09-.193-.813-1.959-1.114-2.682-.292-.71-.588-.613-.813-.625-.214-.012-.459-.012-.708-.012-.247 0-.65.092-.99.441-.34.349-1.295 1.265-1.295 3.081s1.327 3.58 1.512 3.828c.184.248 2.615 3.992 6.338 5.596.886.383 1.578.613 2.116.784.889.283 1.698.243 2.336.147.714-.106 2.194-.897 2.502-1.764.307-.868.307-1.612.215-1.768"/></svg>`;
  let h='<tr><th>Name</th><th>Phone</th><th>App</th><th>Del</th></tr>';
  s.forEach(c=>{let d=c.val();let appLink = d.phone? `<a href="${getWaLink(d.phone)}" target="_blank" class="wa-icon">${waSvg}</a>` : `<span class="btn-none">-</span>`;h+=`<tr><td>${d.name}</td><td>${d.phone}</td><td>${appLink}</td><td><button class="btn-del" onclick="delSupport('${c.key}')">Del</button></td></tr>`});document.getElementById('supportList').innerHTML=h})
</script></body></html>
