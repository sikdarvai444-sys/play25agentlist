<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b3d91">
<title>PLAY25 Agent List</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#0b3d91;
    color:#fff;
    overflow-x:hidden;
}

/* ================= HEADER ================= */

.header{
    width:100%;
    min-height:180px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 8px;
}

.search-icon,
.grid-icon{
    width:45px;
    height:45px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    color:#ffeb00;
    cursor:pointer;
    flex-shrink:0;
}

.logo{
    flex:1;
    text-align:center;
}

.logo img{
    width:180px;
    max-width:100%;
    height:auto;
    display:block;
    margin:0 auto;
}

/* ================= MENU ================= */

.menu{
    background:#1153c7;
    margin:8px;
    border-radius:12px;
    padding:15px 8px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:15px 18px;
}

.menu a{
    color:#fff;
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    white-space:nowrap;
    transition:.2s;
}

.menu a:hover,
.menu a.active{
    color:#ffeb3b;
}

/* ================= HOME BOXES ================= */

.box{
    background:#1153c7;
    margin:8px;
    border-radius:10px;
    padding:14px;
    overflow:hidden;
}

h2{
    text-align:center;
    color:#ffeb3b;
    margin-bottom:18px;
    font-size:22px;
    font-weight:bold;
    text-transform:uppercase;
}

/* ================= TABLE ================= */

.table-wrap{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

table{
    width:100%;
    min-width:720px;
    border-collapse:collapse;
    font-size:12px;
}

thead{
    background:#0b3d91;
}

th{
    color:#fff;
    padding:10px 4px;
    text-align:center;
    font-weight:500;
    white-space:nowrap;
}

td{
    padding:9px 4px;
    text-align:center;
    border-bottom:2px solid #1976d2;
    vertical-align:middle;
}

tbody tr{
    transition:.2s;
}

tbody tr:hover{
    background:rgba(255,255,255,.04);
}

/* ================= AGENT ================= */

.agent-box{
    display:flex;
    align-items:center;
    gap:5px;
}

.avatar{
    width:34px;
    height:34px;
    min-width:34px;
    border-radius:50%;
    background:#7cbf00;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.avatar-default{
    font-size:18px;
}

.name-col{
    text-align:left;
    white-space:nowrap;
    padding-left:3px;
}

.name-col b{
    font-size:12px;
    font-weight:500;
    display:block;
}

.name-col small{
    font-size:10px;
    color:#aaa;
    display:block;
}

/* ================= ID ================= */

.id-box{
    background:#8bc400;
    color:#111;
    padding:7px 9px;
    border-radius:8px;
    font-weight:bold;
    font-size:11px;
    display:inline-block;
}

/* ================= RATING ================= */

.stars{
    color:#ffc107;
    font-size:13px;
    letter-spacing:-2px;
    white-space:nowrap;
}

/* ================= WHATSAPP ================= */

.btn-wa-app{
    background:transparent;
    width:34px;
    height:34px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
}

.btn-wa-app svg{
    width:30px;
    height:30px;
    fill:#fff;
}

.btn-wa-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    margin:2px 0;
    text-decoration:none;
}

.btn-wa-num{
    font-size:10px;
    font-weight:bold;
    color:#fff;
    line-height:1.1;
    white-space:nowrap;
}

.btn-wa{
    background:#25D366;
    color:#fff;
    padding:3px 7px;
    border-radius:10px;
    text-decoration:none;
    font-size:8px;
    display:inline-block;
    line-height:1;
}

/* ================= BUTTONS ================= */

.btn-report{
    background:#f44336;
    color:#fff;
    padding:6px 10px;
    border-radius:7px;
    text-decoration:none;
    font-size:10px;
    cursor:pointer;
    border:0;
    display:inline-block;
}

.btn-report:hover{
    background:#ff5b52;
}

.btn-view{
    color:#fff;
    padding:4px 6px;
    border-radius:5px;
    text-decoration:none;
    font-size:19px;
    cursor:pointer;
    display:inline-block;
}

.btn-view:hover{
    transform:scale(1.1);
}

.btn-none{
    color:#aaa;
    font-size:15px;
}

/* ================= COLUMN WIDTH ================= */

th:nth-child(1){width:20%}
th:nth-child(2){width:8%}
th:nth-child(3){width:10%}
th:nth-child(4){width:8%}
th:nth-child(5){width:8%}
th:nth-child(6){width:22%}
th:nth-child(7){width:7%}
th:nth-child(8){width:12%}

/* ================= SUPPORT ================= */

.support-btn{
    position:fixed;
    bottom:18px;
    left:18px;
    background:#8bc400;
    padding:10px 18px;
    border-radius:12px;
    color:#fff;
    text-decoration:none;
    font-weight:bold;
    display:flex;
    align-items:center;
    gap:7px;
    z-index:999;
    border:none;
    cursor:pointer;
    font-size:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.3);
}

.support-btn:hover{
    transform:translateY(-2px);
}

/* ================= POPUP ================= */

.popup-overlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.8);
    z-index:9999;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.popup{
    background:#1153c7;
    width:100%;
    max-width:430px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:12px;
    padding:18px;
    position:relative;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.popup h3{
    background:#0b3d91;
    padding:12px;
    border-radius:7px;
    text-align:center;
    color:#ffeb3b;
    margin-bottom:12px;
    font-size:18px;
}

.close-btn{
    position:absolute;
    top:10px;
    right:15px;
    font-size:28px;
    color:#fff;
    cursor:pointer;
    z-index:2;
}

.popup label{
    color:#ffeb3b;
    font-size:13px;
    margin-top:10px;
    display:block;
}

.popup select,
.popup input{
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:6px;
    border:none;
    outline:none;
    background:#0b3d91;
    color:#fff;
    font-size:14px;
}

.popup button{
    background:#8bc400;
    color:#fff;
    padding:9px 18px;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
    float:right;
    margin-top:10px;
}

/* ================= VIEW ================= */

.info-box{
    width:100%;
    padding:9px;
    margin:5px 0;
    border-radius:6px;
    background:#0b3d91;
    color:#fff;
    text-align:left;
    min-height:34px;
}

.btn-wa-popup{
    background:#25D366;
    color:#fff;
    padding:8px 14px;
    border-radius:6px;
    text-decoration:none;
    display:inline-block;
    margin:5px 0;
}

.stars-popup{
    text-align:center;
    font-size:22px;
    color:#ffc107;
    margin:7px 0;
}

.hierarchy-tags{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:5px;
}

.tag{
    background:#8bc400;
    color:#fff;
    padding:5px 9px;
    border-radius:15px;
    font-size:10px;
}

/* ================= REPORT ================= */

.report-header{
    background:#f44336;
    color:#fff;
    text-align:center;
    padding:9px;
    border-radius:6px;
    font-weight:bold;
    margin-bottom:10px;
}

.report-wa-btn{
    display:block;
    background:#25D366;
    color:#fff;
    padding:10px;
    border-radius:6px;
    text-decoration:none;
    text-align:center;
    margin-top:12px;
    font-weight:bold;
}

/* ================= SUPPORT LIST ================= */

.support-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:#0b3d91;
    padding:10px;
    border-radius:8px;
    margin-bottom:8px;
}

.support-item .icon{
    width:36px;
    height:36px;
    min-width:36px;
    background:#ffc107;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#000;
    font-weight:bold;
}

.support-item .info{
    flex:1;
}

.support-item .btn-msg{
    background:#8bc400;
    color:#fff;
    padding:6px 9px;
    border-radius:5px;
    text-decoration:none;
    font-size:11px;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    left:50%;
    bottom:80px;
    transform:translateX(-50%);
    background:#222;
    color:#fff;
    padding:10px 16px;
    border-radius:20px;
    display:none;
    z-index:10000;
    font-size:13px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .header{
        min-height:175px;
        padding:8px 5px;
    }

    .search-icon,
    .grid-icon{
        width:40px;
        height:40px;
        font-size:25px;
    }

    .logo img{
        width:180px;
    }

    .menu{
        margin:8px;
        padding:14px 6px;
        gap:14px 16px;
    }

    .menu a{
        font-size:14px;
    }

    .box{
        margin:8px;
        padding:9px;
        border-radius:10px;
    }

    h2{
        font-size:19px;
        margin-bottom:13px;
    }

    table{
        min-width:700px;
        font-size:11px;
    }

    th{
        padding:9px 3px;
    }

    td{
        padding:8px 3px;
    }

    .support-btn{
        left:10px;
        bottom:15px;
        padding:9px 15px;
        font-size:14px;
    }

    .popup{
        max-width:95%;
        padding:15px;
    }
}

/* খুব ছোট ফোন */

@media(max-width:380px){

    .logo img{
        width:155px;
    }

    .menu{
        gap:11px 12px;
    }

    .menu a{
        font-size:12px;
    }

    .box{
        margin:6px;
    }

    h2{
        font-size:17px;
    }
}
</style>
</head>

<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:"AIzaSyAwTPtmSGvThVxDM7uc-ey-SjD4500KJeI",

    authDomain:"play25agent.firebaseapp.com",

    databaseURL:
    "https://play25agent-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:"play25agent"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let allAgentsData = {};


/* =====================================================
   CURRENT PAGE / ROLE
===================================================== */

let fileName =
    window.location.pathname
    .split("/")
    .pop()
    .replace(".html","")
    .toLowerCase();

let currentRole =
    fileName === "" ? "index" : fileName;


const roleNames = {

    index:"ALL AGENT LIST",

    siteowner:"SITE OWNER LIST",

    admin:"ADMIN LIST",

    subadmin:"SUB ADMIN LIST",

    super:"SUPER LIST",

    master:"MASTER LIST"

};

document.getElementById("roleTitle").innerText =
    roleNames[currentRole] || "AGENT LIST";


/* ACTIVE MENU */

document.querySelectorAll(".menu a").forEach(a => {

    if(a.dataset.role === currentRole){

        a.classList.add("active");

    }

});


/* =====================================================
   POPUP FUNCTIONS
===================================================== */

function openSearch(){

    document.getElementById("searchPopup").style.display="flex";

    setTimeout(() => {

        document.getElementById("searchId").focus();

    },100);

}

function closeSearch(){

    document.getElementById("searchPopup").style.display="none";

}

function openSupport(){

    document.getElementById("supportPopup").style.display="flex";

}

function closeSupport(){

    document.getElementById("supportPopup").style.display="none";

}

function closeView(){

    document.getElementById("viewPopup").style.display="none";

}

function closeReport(){

    document.getElementById("reportPopup").style.display="none";

}

function openMenu(){

    document.getElementById("mainMenu")
    .scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

}

function openLottery(e){

    e.preventDefault();

    showToast("Lottery section coming soon");

}


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener("keydown",function(e){

    if(e.key === "Escape"){

        closeSearch();
        closeSupport();
        closeView();
        closeReport();

    }

});


/* =====================================================
   CLICK OUTSIDE POPUP
===================================================== */

document.querySelectorAll(".popup-overlay").forEach(popup => {

    popup.addEventListener("click",function(e){

        if(e.target === popup){

            popup.style.display="none";

        }

    });

});


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.innerText = message;

    toast.style.display="block";

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.style.display="none";

        },2500);

}


/* =====================================================
   WHATSAPP
===================================================== */

function getWaLink(num){

    if(!num) return "#";

    let clean =
        String(num)
        .replace(/[^0-9]/g,"");

    return clean
        ? "https://wa.me/" + clean
        : "#";

}


/* =====================================================
   SAFE TEXT
===================================================== */

function safe(value){

    if(value === undefined ||
       value === null ||
       value === ""){

        return "N/A";

    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ROLE NORMALIZE
===================================================== */

function normalizeRole(role){

    return String(role || "")
        .toLowerCase()
        .replace(/\s+/g,"");

}


/* =====================================================
   RATING
===================================================== */

function getStars(rating){

    let r =
        parseInt(rating || 5);

    if(r < 0) r = 0;

    if(r > 5) r = 5;

    return "★".repeat(r) +
           "☆".repeat(5-r);

}


/* =====================================================
   HIERARCHY
===================================================== */

function getHierarchy(agent){

    let tags = "";

    if(agent.parent){

        tags +=
        `<span class="tag">
        Direct: ${safe(agent.parent)}
        </span>`;

    }

    if(agent.parentParent){

        tags +=
        `<span class="tag">
        Upper: ${safe(agent.parentParent)}
        </span>`;

    }

    if(agent.parentSerial){

        tags +=
        `<span class="tag">
        ${safe(agent.parentSerial)}
        </span>`;

    }

    if(agent.role !== "Site Owner"){

        tags +=
        `<span class="tag">
        Level: ${safe(agent.role)}
        </span>`;

    }

    if(!agent.parent){

        tags +=
        `<span class="tag">
        Site Owner
        </span>`;

    }

    return tags ||
        '<span class="tag">No Parent</span>';

}


/* =====================================================
   AVATAR
===================================================== */

function getAvatar(agent){

    if(agent.photo ||
       agent.image ||
       agent.avatar){

        let img =
            agent.photo ||
            agent.image ||
            agent.avatar;

        return `
        <div class="avatar">
            <img
                src="${safe(img)}"
                alt=""
                onerror="this.parentElement.innerHTML='👤'"
            >
        </div>`;

    }

    return `
    <div class="avatar avatar-default">
        👤
    </div>`;

}


/* =====================================================
   VIEW AGENT
===================================================== */

function viewAgent(key){

    const a =
        allAgentsData[key];

    if(!a) return;

    document.getElementById("viewName")
        .innerText = a.name || "N/A";

    document.getElementById("viewRole")
        .innerText = a.role || "N/A";

    document.getElementById("viewPhone")
        .innerText = a.phone || "N/A";

    document.getElementById("viewId")
        .innerText = a.id || "N/A";

    document.getElementById("viewSerial")
        .innerText = a.serial || "-";

    document.getElementById("viewWa")
        .href = getWaLink(a.phone);

    document.getElementById("viewRating")
        .innerText = getStars(a.rating || 5);

    document.getElementById("viewHierarchy")
        .innerHTML = getHierarchy(a);

    const avatar =
        document.getElementById("viewAvatar");

    if(a.photo || a.image || a.avatar){

        const image =
            a.photo || a.image || a.avatar;

        avatar.innerHTML =
        `<img
            src="${safe(image)}"
            style="width:100%;height:100%;object-fit:cover"
            onerror="this.parentElement.innerHTML='👤'"
        >`;

    }else{

        avatar.innerHTML="👤";

    }

    document.getElementById("viewPopup")
        .style.display="flex";

}


/* =====================================================
   REPORT AGENT
===================================================== */

function reportAgent(key){

    const a =
        allAgentsData[key];

    if(!a) return;

    document.getElementById("reportName")
        .innerText = a.name || "N/A";

    document.getElementById("reportRole")
        .innerText = a.role || "N/A";

    document.getElementById("reportPhone")
        .innerText = a.phone || "N/A";

    document.getElementById("reportId")
        .innerText = a.id || "N/A";

    document.getElementById("reportHierarchy")
        .innerHTML = getHierarchy(a);

    document.getElementById("reportWa")
        .href = getWaLink(a.phone);

    document.getElementById("reportPopup")
        .style.display="flex";

}

/* =====================================================
   RENDER AGENTS
===================================================== */

function renderAgents(data){

    let html = "";

    let count = 0;

    for(let key in data){

        const a = data[key];

        const role =
            normalizeRole(a.role);

        if(
            currentRole !== "index" &&
            role !== currentRole
        ){

            continue;

        }

        count++;

        /* APP */

        const appLink = `
        <a
            href="${getWaLink(a.phone)}"
            target="_blank"
            rel="noopener"
            class="btn-wa-app"
            title="WhatsApp"
        >
            ${whatsappIcon()}
        </a>`;


        /* FACEBOOK */

        let fbLink =
            `<span class="btn-none">--</span>`;

        if(a.facebook){

            fbLink = `
            <a
                href="${safe(a.facebook)}"
                target="_blank"
                rel="noopener"
                style="
                color:#fff;
                font-size:25px;
                text-decoration:none;
                "
                title="Facebook"
            >
                ●
            </a>`;

        }


        /* PHONE */

        let phoneBtns = "";

        if(a.phone){

            phoneBtns += `
            <a
                href="${getWaLink(a.phone)}"
                target="_blank"
                rel="noopener"
                class="btn-wa-wrap"
            >

                <div class="btn-wa-num">
                    ${safe(a.phone)}
                </div>

                <div class="btn-wa">
                    Whatsapp
                </div>

            </a>`;

        }


        if(a.phone2){

            phoneBtns += `
            <a
                href="${getWaLink(a.phone2)}"
                target="_blank"
                rel="noopener"
                class="btn-wa-wrap"
            >

                <div class="btn-wa-num">
                    ${safe(a.phone2)}
                </div>

                <div class="btn-wa">
                    Whatsapp
                </div>

            </a>`;

        }


        /* PHOTO */

        const avatar =
            getAvatar(a);


        html += `

        <tr>

            <td class="name-col">

                <div class="agent-box">

                    ${avatar}

                    <div>

                        <b>
                            ${safe(a.name)}
                        </b>

                        <small>
                            ${safe(a.role)}
                        </small>

                    </div>

                </div>

            </td>


            <td>

                <div class="id-box">

                    ID ${safe(a.id)}

                </div>

            </td>


            <td class="stars">

                ${getStars(a.rating || 5)}

            </td>


            <td>

                ${appLink}

            </td>


            <td>

                ${fbLink}

            </td>


            <td>

                ${phoneBtns || "--"}

            </td>


            <td>

                <a
                    onclick="viewAgent('${key}')"
                    class="btn-view"
                    title="View"
                >
                    👁️
                </a>

            </td>


            <td>

                <a
                    onclick="reportAgent('${key}')"
                    class="btn-report"
                >
                    Report
                </a>

            </td>

        </tr>`;

    }


    document.getElementById("agentList")
        .innerHTML =
        html ||
        `<tr>
            <td colspan="8">
                কোন Agent নেই
            </td>
        </tr>`;

}


/* =====================================================
   FIREBASE AGENTS
===================================================== */

db.ref("agents").on(

    "value",

    snap => {

        allAgentsData =

        renderAgents(allAgentsData);

    },

    error => {

        console.error(error);

        document.getElementById("agentList")
            .innerHTML =
            `<tr>
                <td colspan="8">
                    Data Load Error
                </td>
            </tr>`;

    }

);


/* =====================================================
   SEARCH
===================================================== */

function doSearch(){

    const type =
        document.getElementById("searchType")
        .value;

    const id =
        document.getElementById("searchId")
        .value
        .trim()
        .toLowerCase();

    const phone =
        document.getElementById("searchPhone")
        .value
        .trim()
        .toLowerCase();


    const result = {};


    for(let key in allAgentsData){

        const a =
            allAgentsData[key];


        /* ROLE */

        if(
            type !== "all" &&
            String(a.role || "").toLowerCase()
            !== type.toLowerCase()
        ){

            continue;

        }


        /* CURRENT PAGE ROLE */

        if(
            currentRole !== "index" &&
            normalizeRole(a.role)
            !== currentRole
        ){

            continue;

        }


        /* ID */

        if(
            id &&
            !String(a.id || "")
            .toLowerCase()
            .includes(id)
        ){

            continue;

        }


        /* PHONE */

        const p1 =
            String(a.phone || "")
            .toLowerCase();

        const p2 =
            String(a.phone2 || "")
            .toLowerCase();


        if(
            phone &&
            !p1.includes(phone) &&
            !p2.includes(phone)
        ){

            continue;

        }


        result[key] = a;

    }


    renderAgents(result);

    closeSearch();


    if(
        Object.keys(result).length === 0
    ){

        showToast("কোন Agent পাওয়া যায়নি");

    }else{

        showToast(
            Object.keys(result).length +
            " জন Agent পাওয়া গেছে"
        );

    }

}


/* =====================================================
   ENTER KEY SEARCH
===================================================== */

["searchId","searchPhone"].forEach(id => {

    document.getElementById(id)
    .addEventListener("keydown",function(e){

        if(e.key === "Enter"){

            doSearch();

        }

    });

});
