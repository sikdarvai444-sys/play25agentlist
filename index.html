<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PLAY25 Agent List</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#064b80;
    color:white;
    font-family:"Noto Sans Bengali",Arial,sans-serif;
}

button{
    font-family:inherit;
}

.header{
    height:185px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#064b80;
}

.logo{
    width:330px;
    max-width:65%;
}

.top-icon{
    position:absolute;
    top:65px;
    color:#ffe21b;
    font-size:38px;
}

.top-icon.left{
    left:60px;
}

.top-icon.right{
    right:55px;
}

.container{
    width:calc(100% - 46px);
    max-width:650px;
    margin:auto;
    padding-bottom:100px;
}

/* NAVIGATION */

.nav{
    background:#0968ad;
    border-radius:22px;
    padding:28px 15px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:22px 18px;
}

.nav button{
    background:none;
    border:0;
    color:white;
    font-size:23px;
    cursor:pointer;
}

.nav button i{
    margin-right:6px;
}

.nav button.active{
    color:#ffe21b;
}

/* NOTICE */

.notice{
    height:76px;
    margin-top:30px;
    border-radius:18px;
    background:#0967aa;
    display:flex;
    align-items:center;
    overflow:hidden;
}

.marquee{
    color:#ffe21b;
    font-size:25px;
    white-space:nowrap;
    animation:moveText 10s linear infinite;
}

@keyframes moveText{
    from{
        transform:translateX(100%);
    }

    to{
        transform:translateX(-100%);
    }
}

/* FACEBOOK */

.social{
    margin-top:30px;
    min-height:76px;
    background:#0967aa;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:10px;
    color:#ffe21b;
    font-size:21px;
    text-align:center;
}

.social-btn{
    background:#1678e8;
    color:white;
    padding:8px 13px;
    border-radius:10px;
    text-decoration:none;
    white-space:nowrap;
}

/* TITLE */

.page-title{
    text-align:center;
    color:#ffe21b;
    font-size:28px;
    font-weight:500;
    margin:30px 0 18px;
}

/* HOME */

.home-card{
    background:#0967aa;
    border-radius:18px;
    padding:20px 8px 25px;
}

.agent-card{
    background:#0b426b;
    border-radius:16px;
    padding:18px 14px;

    display:flex;
    align-items:center;
    gap:14px;
}

.avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#8bc510;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#125073;
    font-size:25px;
    flex-shrink:0;
}

.agent-info{
    flex:1;
}

.agent-name{
    font-size:17px;
}

.role{
    color:#aeb8c1;
    font-size:14px;
}

.idbox{
    background:#8bc510;
    color:#173b15;
    border-radius:11px;
    padding:8px 11px;
    text-align:center;
    font-weight:bold;
}

.idbox small{
    display:block;
    font-size:10px;
}

.phone{
    font-size:14px;
    white-space:nowrap;
}

.whatsapp{
    display:inline-block;
    background:#43c45a;
    color:white;
    border-radius:8px;
    padding:2px 7px;
    font-size:12px;
}

.message{
    background:#43bd51;
    border:none;
    color:white;
    padding:8px 16px;
    border-radius:9px;
}

/* TABLE */

.table-wrap{
    background:#0b426b;
    border-radius:18px;
    padding:28px 24px 10px;
    overflow-x:auto;
}

.table-head{
    min-width:800px;

    background:#096ab0;
    border-radius:15px;

    padding:12px 8px;

    display:grid;

    grid-template-columns:
    1.65fr
    .62fr
    1.05fr
    .58fr
    .78fr
    1.25fr
    .55fr
    .8fr;

    gap:7px;

    text-align:center;
    font-size:15px;
}

.agent-row{
    min-width:800px;
    min-height:90px;

    display:grid;

    grid-template-columns:
    1.65fr
    .62fr
    1.05fr
    .58fr
    .78fr
    1.25fr
    .55fr
    .8fr;

    align-items:center;

    gap:7px;

    text-align:center;

    border-bottom:2px solid white;
}

.name-cell{
    display:flex;
    align-items:center;
    gap:8px;
    text-align:left;
}

.name-cell .avatar{
    width:45px;
    height:45px;
    font-size:20px;
}

.name-text b{
    display:block;
    font-size:14px;
    font-weight:500;
}

.name-text span{
    display:block;
    color:#aeb8c1;
    font-size:13px;
}

.rating{
    background:#142f47;
    border-radius:8px;
    padding:5px 3px;
    color:#ffe21b;
    font-size:12px;
}

.icon-link{
    color:white;
    font-size:33px;
}

.fb{
    color:white;
    font-size:29px;
}

.phone-cell{
    font-size:12px;
    line-height:1.1;
}

.eye{
    color:white;
    font-size:24px;
}

.report{
    background:#ff4b52;
    border:none;
    color:white;
    padding:7px 12px;
    border-radius:9px;
    cursor:pointer;
}

/* PROCESS */

.process{
    background:#0967aa;
    border-radius:18px;
    margin-top:32px;
    padding:25px 14px;
}

.process h2{
    color:#ffe21b;
    text-align:center;
    font-weight:500;
    margin-top:0;
}

.process-row{
    background:#0b426b;
    border-radius:15px;
    padding:18px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.domain{
    font-size:21px;
}

.active{
    color:#39f34e;
}

.visit{
    background:#8bc510;
    color:white;
    padding:8px 15px;
    border-radius:10px;
    text-decoration:none;
}

/* SUPPORT */

.support{
    position:fixed;
    left:30px;
    bottom:25px;

    background:#8bc510;
    color:white;

    border:none;
    border-radius:15px;

    padding:12px 18px;

    font-size:22px;
    font-weight:bold;

    z-index:100;
}

.support i{
    margin-right:7px;
}

/* MOBILE */

@media(max-width:560px){

    .container{
        width:calc(100% - 46px);
    }

    .logo{
        width:330px;
        max-width:62%;
    }

    .top-icon.left{
        left:60px;
        font-size:35px;
    }

    .top-icon.right{
        right:55px;
        font-size:33px;
    }

    .nav{
        gap:22px 15px;
    }

    .nav button{
        font-size:21px;
    }

    .social{
        flex-wrap:wrap;
    }

    .table-wrap{
        overflow-x:auto;
    }

}

</style>
</head>
