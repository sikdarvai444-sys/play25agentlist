<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PLAY25 Agent List</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
}

body{
    background:#0b3d91;
    color:#fff;
}

/* ================= HEADER ================= */

.header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 5px;
}

.search-icon,
.grid-icon{
    width:35px;
    flex-shrink:0;
    text-align:center;
    font-size:21px;
    color:#ffc107;
    cursor:pointer;
}

.logo{
    flex:1;
    min-width:0;
    text-align:center;
}

.logo img{
    display:block;
    width:auto;
    max-width:170px;
    max-height:65px;
    height:auto;
    margin:auto;
}

/* ================= MENU ================= */

.menu{
    width:calc(100% - 16px);
    margin:8px;
    padding:9px 5px;
    background:#1153c7;
    border-radius:8px;

    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:8px 11px;
}

.menu a{
    color:#fff;
    text-decoration:none;
    font-size:11px;
    font-weight:500;
    white-space:nowrap;
}

.menu a.active{
    color:#ffeb3b;
}

/* ================= MAIN BOX ================= */

.box{
    width:calc(100% - 16px);
    margin:8px;
    padding:7px 3px;
    background:#1153c7;
    border-radius:8px;
    overflow:hidden;
}

h2{
    text-align:center;
    color:#ffeb3b;
    margin-bottom:8px;
    font-size:15px;
    font-weight:bold;
    text-transform:uppercase;
}

/* ================= TABLE ================= */

table{
    width:100%;
    max-width:100%;
    table-layout:fixed;
    border-collapse:collapse;
    font-size:7px;
}

thead{
    background:#0b3d91;
}

th{
    padding:6px 0;
    color:#fff;
    text-align:center;
    font-size:7px;
    font-weight:500;
    line-height:1.1;
    white-space:normal;
    overflow:hidden;
}

td{
    padding:5px 0;
    text-align:center;
    vertical-align:middle;
    border-bottom:2px solid rgba(255,255,255,.8);
    overflow:hidden;
}

/* COLUMN SIZE */

th:nth-child(1),
td:nth-child(1){
    width:21%;
}

th:nth-child(2),
td:nth-child(2){
    width:9%;
}

th:nth-child(3),
td:nth-child(3){
    width:10%;
}

th:nth-child(4),
td:nth-child(4){
    width:7%;
}

th:nth-child(5),
td:nth-child(5){
    width:6%;
}

th:nth-child(6),
td:nth-child(6){
    width:26%;
}

th:nth-child(7),
td:nth-child(7){
    width:7%;
}

th:nth-child(8),
td:nth-child(8){
    width:14%;
}

/* ================= NAME ================= */

.name-col{
    text-align:left;
    white-space:normal;
    padding-left:1px;
}

.name-col b{
    display:inline-block;
    vertical-align:middle;
    max-width:calc(100% - 24px);

    font-size:8px;
    font-weight:500;
    line-height:1.05;

    overflow-wrap:anywhere;
    word-break:break-word;
}

.name-col small{
    display:block;
    margin-left:22px;

    color:#aaa;
    font-size:6px;
    line-height:1.05;

    white-space:normal;
    overflow-wrap:anywhere;
}

/* ================= AVATAR ================= */

.avatar{
    width:20px;
    height:20px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    vertical-align:middle;

    background:#7cb900;
    border-radius:50%;

    margin-right:1px;
}

.avatar:after{
    content:"👤";
    font-size:11px;
}

/* ================= ID ================= */

.id-box{
    display:inline-block;

    background:#8bc400;
    color:#000;

    padding:3px 2px;
    border-radius:4px;

    font-size:6px;
    font-weight:bold;

    line-height:1;
    max-width:100%;
    overflow:hidden;
}

/* ================= RATING ================= */

.stars{
    color:#ffc107;
    font-size:7px;
    letter-spacing:-2px;
    white-space:nowrap;
}

/* ================= WHATSAPP APP ================= */

.btn-wa-app{
    width:22px;
    height:22px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    background:transparent;
    border-radius:50%;

    text-decoration:none;
}

.btn-wa-app svg{
    width:20px;
    height:20px;
    fill:#fff;
}

/* ================= PHONE ================= */

.btn-wa-wrap{
    width:100%;
    max-width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:2px;

    margin:1px 0;

    text-decoration:none;
}

.btn-wa-num{
    width:100%;

    color:#fff;

    font-size:6px;
    font-weight:bold;

    line-height:1.1;

    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-all;
}

.btn-wa{
    display:inline-block;

    background:#25D366;
    color:#fff;

    padding:2px 3px;

    border-radius:7px;

    text-decoration:none;

    font-size:5px;
    line-height:1;
}

/* ================= VIEW ================= */

.btn-view{
    color:#fff;
    padding:2px;
    font-size:12px;
    cursor:pointer;
    text-decoration:none;
}

/* ================= REPORT ================= */

.btn-report{
    display:inline-block;

    background:#f44336;
    color:#fff;

    padding:3px 3px;

    border-radius:5px;

    font-size:6px;

    cursor:pointer;
    text-decoration:none;
}

/* ================= NONE ================= */

.btn-none{
    color:#888;
    font-size:9px;
}

/* ================= SUPPORT ================= */

.support-btn{
    position:fixed;

    left:9px;
    bottom:10px;

    z-index:99;

    display:flex;
    align-items:center;
    gap:4px;

    background:#8bc400;
    color:#fff;

    padding:7px 11px;

    border:none;
    border-radius:15px;

    font-size:11px;
    font-weight:bold;

    cursor:pointer;
}

/* ================= POPUP ================= */

.popup-overlay{
    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.82);

    z-index:999;

    justify-content:center;
    align-items:center;

    padding:10px;
}

.popup{
    position:relative;

    width:100%;
    max-width:400px;
    max-height:90vh;

    overflow-y:auto;

    background:#1153c7;

    border-radius:10px;

    padding:14px;
}

.popup h3{
    background:#000;
    color:#ffeb3b;

    padding:9px;

    margin-bottom:10px;

    border-radius:5px;

    text-align:center;
}

.close-btn{
    position:absolute;

    top:7px;
    right:12px;

    color:#fff;

    font-size:24px;

    cursor:pointer;
}

.popup label{
    display:block;

    color:#ffeb3b;

    font-size:12px;

    margin-top:8px;
}

.popup select,
.popup input{
    width:100%;

    padding:8px;

    margin:5px 0;

    border:none;
    border-radius:5px;

    background:#0b3d91;
    color:#fff;

    outline:none;
}

.popup button{
    float:right;

    margin-top:10px;

    background:#4caf50;
    color:#fff;

    padding:8px 15px;

    border:none;
    border-radius:5px;

    font-weight:bold;

    cursor:pointer;
}

/* ================= INFO BOX ================= */

.info-box{
    width:100%;

    padding:8px;

    margin:5px 0;

    border-radius:5px;

    background:#0b3d91;
    color:#fff;

    text-align:left;

    overflow-wrap:anywhere;
}

/* ================= VIEW WHATSAPP ================= */

.btn-wa-popup{
    display:inline-block;

    margin:5px 0;

    padding:6px 12px;

    background:#25D366;
    color:#fff;

    border-radius:5px;

    text-decoration:none;
}

.stars-popup{
    text-align:center;

    color:#ffc107;

    font-size:18px;

    margin:5px 0;
}

/* ================= HIERARCHY ================= */

.hierarchy-tags{
    display:flex;
    flex-wrap:wrap;
    gap:5px;

    margin-top:5px;
}

.tag{
    background:#4caf50;

    padding:4px 8px;

    border-radius:15px;

    font-size:9px;
}

/* ================= REPORT ================= */

.report-header{
    background:#f44336;

    color:#fff;

    text-align:center;

    padding:8px;

    border-radius:5px;

    font-weight:bold;

    margin-bottom:10px;
}

.report-wa-btn{
    display:block;

    background:#25D366;
    color:#fff;

    padding:8px;

    border-radius:5px;

    text-decoration:none;

    text-align:center;

    margin-top:10px;

    font-weight:bold;
}

/* ================= SUPPORT LIST ================= */

.support-item{
    display:flex;
    align-items:center;

    gap:8px;

    background:#0b3d91;

    padding:8px;

    border-radius:8px;

    margin-bottom:8px;
}

.support-item .icon{
    width:30px;
    height:30px;

    flex-shrink:0;

    background:#ffc107;

    color:#000;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:bold;
}

.support-item .info{
    flex:1;
    min-width:0;
}

.support-item .btn-msg{
    background:#4caf50;
    color:#fff;

    padding:4px 8px;

    border-radius:5px;

    text-decoration:none;

    font-size:10px;

    white-space:nowrap;
}

/* ================= SMALL MOBILE ================= */

@media(max-width:360px){

    .header{
        padding:5px 3px;
    }

    .logo img{
        max-width:150px;
        max-height:58px;
    }

    .search-icon,
    .grid-icon{
        width:31px;
        font-size:19px;
    }

    .menu{
        gap:7px 8px;
        padding:8px 3px;
    }

    .menu a{
        font-size:9px;
    }

    .box{
        padding:6px 2px;
    }

    h2{
        font-size:13px;
    }

    table{
        font-size:6px;
    }

    th{
        font-size:6px;
        padding:5px 0;
    }

    td{
        padding:4px 0;
    }

    .name-col b{
        font-size:7px;
        max-width:calc(100% - 21px);
    }

    .name-col small{
        margin-left:21px;
        font-size:5.5px;
    }

    .avatar{
        width:18px;
        height:18px;
    }

    .avatar:after{
        font-size:10px;
    }

    .id-box{
        font-size:5.5px;
        padding:3px 1px;
    }

    .stars{
        font-size:6px;
    }

    .btn-wa-app{
        width:20px;
        height:20px;
    }

    .btn-wa-app svg{
        width:18px;
        height:18px;
    }

    .btn-wa-num{
        font-size:5.5px;
    }

    .btn-wa{
        font-size:4.5px;
        padding:2px;
    }

    .btn-view{
        font-size:10px;
    }

    .btn-report{
        font-size:5.5px;
        padding:3px 2px;
    }

    .support-btn{
        left:7px;
        bottom:8px;
        padding:6px 9px;
        font-size:10px;
    }
}

/* ================= VERY SMALL PHONE ================= */

@media(max-width:320px){

    .menu{
        gap:6px;
    }

    .menu a{
        font-size:8px;
    }

    h2{
        font-size:12px;
    }

    table{
        font-size:5.5px;
    }

    th{
        font-size:5.5px;
    }

    .name-col b{
        font-size:6.5px;
    }

    .name-col small{
        font-size:5px;
    }

    .id-box{
        font-size:5px;
    }

    .btn-report{
        font-size:5px;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

    <div class="search-icon" onclick="openSearch()">🔍</div>

    <div class="logo">
        <img src="logo.png" alt="PLAY25 Agent List">
    </div>

    <div class="grid-icon">⊞</div>

</div>


<!-- ================= MENU ================= -->

<div class="menu">

    <a href="index.html">🏠 Home</a>

    <a href="siteowner.html">👤 Site Owner</a>

    <a href="admin.html">👤 Admin</a>

    <a href="subadmin.html">👤 Sub Admin</a>

    <a href="super.html">👤 Super</a>

    <a href="master.html">👤 Master</a>

    <a href="#">🎯 Lottery</a>

</div>


<!-- ================= AGENT TABLE ================= -->

<div class="box">

    <h2 id="roleTitle">MASTER LIST</h2>

    <table>

        <thead>

            <tr>
                <th>Name</th>
                <th>ID</th>
                <th>Rating</th>
                <th>App</th>
                <th>FB</th>
                <th>Phone</th>
                <th>View</th>
                <th>Report</th>
            </tr>

        </thead>

        <tbody id="agentList">

            <tr>
                <td colspan="8">Loading...</td>
            </tr>

        </tbody>

</div>


<!-- ================= SUPPORT BUTTON ================= -->

</button>


<!-- ================= SEARCH POPUP ================= -->

        <span class="close-btn" onclick="closeSearch()">&times;</span>

        <h3>👤 এজেন্ট খুঁজুন</h3>

        <label>Type</label>

        <select id="searchType">

            <option value="all">All Agent</option>

        <label>Search By Agent ID</label>

        <input
            type="text"
            id="searchId"
            placeholder="Agent ID"
        >


        <label>Search by Whatsapp</label>

        <button onclick="doSearch()">

</div>


<!-- ================= SUPPORT POPUP ================= -->

<div class="popup-overlay" id="supportPopup">

    <div class="popup">

        <span class="close-btn" onclick="closeSupport()">&times;</span>

        <h3>🎧 Support Team</h3>

        <div id="supportList">
            Loading...
        </div>

    </div>

</div>


<!-- ================= VIEW POPUP ================= -->

<div class="popup-overlay" id="viewPopup">

    <div class="popup">

        <span class="close-btn" onclick="closeView()">&times;</span>


        <div style="text-align:center;margin-bottom:10px">

            <div
                style="
                width:60px;
                height:60px;
                border-radius:50%;
                background:#555;
                margin:0 auto;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:30px;
                "
            >
                👤
            </div>

        </div>


        <label>Name</label>
        <div class="info-box" id="viewName"></div>


        <label>Type</label>
        <div class="info-box" id="viewRole"></div>


        <label>Number</label>
        <div class="info-box" id="viewPhone"></div>


        <label>ID Number</label>

        <label>Serial</label>

        <label>Message</label>

        <a
            id="viewWa"
            href="#"
            target="_blank"
            class="btn-wa-popup"
        >
            📱 Whatsapp
        </a>


        <label>Rating</label>

        <div class="stars-popup">
            ★★★
        </div>


        <label>Hierarchy / কার আন্ডারে</label>

        <div
            class="hierarchy-tags"
            id="viewHierarchy"
        ></div>

    </div>

</div>


<!-- ================= REPORT POPUP ================= -->

<div class="popup-overlay" id="reportPopup">

    <div class="popup">

        <span class="close-btn" onclick="closeReport()">&times;</span>


        <div style="text-align:center;margin-bottom:10px">

            <div
                style="
                width:60px;
                height:60px;
                border-radius:50%;
                background:#555;
                margin:0 auto;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:30px;
                "
            >
                👤
            </div>

        </div>


        <div class="report-header">
            Report This Person
        </div>


        <label>Name</label>
        <div class="info-box" id="reportName"></div>


        <label>Type</label>
        <div class="info-box" id="reportRole"></div>


        <label>Number</label>
        <div class="info-box" id="reportPhone"></div>


        <label>ID Number</label>
        <div class="info-box" id="reportId"></div>


        <label>Hierarchy / কার আন্ডারে আছে</label>

        <div
            class="hierarchy-tags"
            id="reportHierarchy"
        ></div>


        <a
            id="reportWa"
            href="#"
            target="_blank"
            class="report-wa-btn"
        >
            📱 Whatsapp এ মেসেজ করুন
        </a>

    </div>

</div>


<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>


<script>

const firebaseConfig = {

    apiKey: "AIzaSyAwTPtmSGvThVxDM7uc-ey-SjD4500KJeI",

    authDomain: "play25agent.firebaseapp.com",

    databaseURL:
    "https://play25agent-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId: "play25agent"

};


firebase.initializeApp(firebaseConfig);

const db = firebase.database();


let allAgentsData = {};


/* ================= CURRENT PAGE ================= */

let fileName =
    window.location.pathname
    .split("/")
    .pop()
    .replace(".html","");


let currentRole =
    fileName === ""
    ? "index"
    : fileName;


const roleNames = {

    "index":
    "ALL AGENT LIST",

    "siteowner":
    "SITE OWNER LIST",

    "admin":
    "ADMIN LIST",

    "subadmin":
    "SUB ADMIN LIST",

    "super":
    "SUPER LIST",

    "master":
    "MASTER LIST"

};


document.getElementById("roleTitle").innerText =
    roleNames[currentRole] || "AGENT LIST";


/* ================= ACTIVE MENU ================= */

document
.querySelectorAll(".menu a")
.forEach(a => {

    let href = a.getAttribute("href") || "";

    if(
        href.includes(currentRole) ||
        (currentRole === "index" && href === "index.html")
    ){

        a.classList.add("active");

    }

});


/* ================= POPUPS ================= */

function openSearch(){

    document
    .getElementById("searchPopup")
    .style.display = "flex";

}


function closeSearch(){

    document
    .getElementById("searchPopup")
    .style.display = "none";

}


function openSupport(){

    document
    .getElementById("supportPopup")
    .style.display = "flex";

}


function closeSupport(){

    document
    .getElementById("supportPopup")
    .style.display = "none";

}


function closeView(){

    document
    .getElementById("viewPopup")
    .style.display = "none";

}


function closeReport(){

    document
    .getElementById("reportPopup")
    .style.display = "none";

}


/* ================= WHATSAPP ================= */

function getWaLink(num){

    if(!num) return "";

    let clean =
        String(num)
        .replace(/[^0-9]/g,"");

    return "https://wa.me/" + clean;

}


/* ================= HIERARCHY ================= */

function getHierarchy(agent){

    let tags = "";

    if(agent.parent){

        tags +=
        `<span class="tag">
        Direct: ${agent.parent}
        </span>`;

    }

    if(agent.parentParent){

        tags +=
        `<span class="tag">
        Upper: ${agent.parentParent}
        </span>`;

    }

    if(agent.parentSerial){

        tags +=
        `<span class="tag">
        ${agent.parentSerial}
        </span>`;

    }

    if(agent.role != "Site Owner"){

        tags +=
        `<span class="tag">
        Level: ${agent.role}
        </span>`;

    }

    if(!agent.parent){

        tags +=
        `<span class="tag">
        Site Owner
        </span>`;

    }

    return tags ||
    '<span class="tag">No Parent</span>';

}


/* ================= VIEW AGENT ================= */

function viewAgent(key){

    let a = allAgentsData[key];

    if(!a) return;


    document.getElementById("viewName").innerText =
        a.name || "N/A";


    document.getElementById("viewRole").innerText =
        a.role || "N/A";


    document.getElementById("viewPhone").innerText =
        a.phone || "N/A";


    document.getElementById("viewId").innerText =
        a.id || "N/A";


    document.getElementById("viewSerial").innerText =
        a.serial || "-";


    document.getElementById("viewWa").href =
        getWaLink(a.phone);


    document.getElementById("viewHierarchy").innerHTML =
        getHierarchy(a);


    document.getElementById("viewPopup").style.display =
        "flex";

}


/* ================= REPORT ================= */

function reportAgent(key){

    let a = allAgentsData[key];

    if(!a) return;


    document.getElementById("reportName").innerText =
        a.name || "N/A";


    document.getElementById("reportRole").innerText =
        a.role || "N/A";


    document.getElementById("reportPhone").innerText =
        a.phone || "N/A";


    document.getElementById("reportId").innerText =
        a.id || "N/A";


    document.getElementById("reportHierarchy").innerHTML =
        getHierarchy(a);


    document.getElementById("reportWa").href =
        getWaLink(a.phone);


    document.getElementById("reportPopup").style.display =
        "flex";

}


/* ================= LOAD AGENTS ================= */

    allAgentsData =

/* ================= SEARCH ================= */

function doSearch(){

    let type =
        document
        .getElementById("searchType")
        .value;


    let id =
        document
        .getElementById("searchId")
        .value
        .trim();


    let phone =
        document
        .getElementById("searchPhone")
        .value
        .trim();


    let result = {};


    for(let key in allAgentsData){

        let a = allAgentsData[key];

        let match = true;


        if(
            type !== "all" &&
            a.role !== type
        ){

            match = false;

        }


        if(
            id !== "" &&
            !String(a.id || "")
            .includes(id)
        ){

            match = false;

        }


        if(
            phone !== "" &&
            !String(a.phone || "")
            .includes(phone) &&
            !String(a.phone2 || "")
            .includes(phone)
        ){

            match = false;

        }


        if(match){

            result[key] = a;

        }

    }


    renderAgents(result);

    closeSearch();

}


/* ================= SUPPORT ================= */

db.ref("support").on("value", snap => {

    let html = "";


    snap.forEach(child => {

        let s = child.val();


        html += `

            <div class="support-item">

                <div class="icon">
                    🎧
                </div>


                <div class="info">

                    <b>
                        ${s.name || "Support"}
                    </b>

                    <br>

                    <small>
                        ${s.phone || ""}
                    </small>

                </div>


                <a
                    href="${getWaLink(s.phone)}"
                    class="btn-msg"
                    target="_blank"
                >
                    Message
                </a>

            </div>

        `;

    });


    document.getElementById("supportList").innerHTML =

        html ||

        "কোন Support নেই";

});


/* ================= CLOSE POPUP OUTSIDE ================= */

document
.querySelectorAll(".popup-overlay")
.forEach(popup => {

    popup.addEventListener("click", function(e){

        if(e.target === popup){

            popup.style.display = "none";

        }

    });

});
