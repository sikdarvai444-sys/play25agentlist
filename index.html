<html lang="bn">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<meta name="theme-color" content="#064b80">

<title>PLAY25 Agent List</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* =====================================================
   ROOT
===================================================== */

:root{

    --bg:#064b80;

    --header:#064b80;

    --panel:#0968ad;

    --panel2:#0a5c95;

    --card:#0b426b;

    --card2:#0d507c;

    --yellow:#ffe21b;

    --green:#8bc510;

    --online:#39ef55;

    --blue:#1678e8;

    --red:#ff4b52;

    --white:#ffffff;

    --text:#ffffff;

    --muted:#aeb8c1;

    --shadow:
    0 8px 25px rgba(0,0,0,.15);

}


/* LIGHT MODE */

body.light{

    --bg:#eef5fa;

    --header:#ffffff;

    --panel:#ffffff;

    --panel2:#edf5fb;

    --card:#ffffff;

    --card2:#edf5fb;

    --text:#17232d;

    --muted:#63717d;

}


/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{

    background:var(--bg);

    color:var(--text);

    font-family:
    "Noto Sans Bengali",
    Arial,
    sans-serif;

    min-height:100vh;

    padding-bottom:70px;

    transition:.25s;

}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:185px;

    background:var(--header);

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

}

.logo{

    font-family:Arial,sans-serif;

    font-size:
    clamp(42px,12vw,68px);

    font-weight:900;

    font-style:italic;

    color:#ffe21b;

    letter-spacing:-5px;

    text-shadow:
    2px 2px 0 #fff;

}

.logo span{
    color:#fff;
}

.logo-sub{

    position:absolute;

    top:125px;

    font-size:18px;

    letter-spacing:7px;

    font-weight:bold;

    color:#fff;

}


.header-btn{

    position:absolute;

    top:68px;

    color:var(--yellow);

    background:none;

    border:0;

    font-size:34px;

}

.header-btn.left{
    left:25px;
}

.header-btn.right{
    right:25px;
}


/* =====================================================
   MAIN
===================================================== */

.container{

    width:
    min(94%,680px);

    margin:auto;

}


/* =====================================================
   NAV
===================================================== */

.nav{

    margin-top:0;

    background:
    linear-gradient(
    145deg,
    #096db5,
    #0861a3
    );

    border-radius:
    0 0 22px 22px;

    padding:
    25px 12px;

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:22px 8px;

    box-shadow:var(--shadow);

}

.nav-btn{

    background:none;

    border:0;

    color:white;

    font-size:16px;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:5px;

    transition:.2s;

}

.nav-btn i{

    font-size:20px;

}

.nav-btn.active{

    color:var(--yellow);

    transform:
    translateY(-2px);

}


/* =====================================================
   NOTICE
===================================================== */

.notice{

    margin-top:22px;

    background:var(--panel);

    border-radius:16px;

    height:60px;

    display:flex;

    align-items:center;

    overflow:hidden;

    box-shadow:var(--shadow);

}

.marquee{

    white-space:nowrap;

    color:var(--yellow);

    font-size:20px;

    animation:
    marquee 12s linear infinite;

}

@keyframes marquee{

    from{
        transform:
        translateX(100%);
    }

    to{
        transform:
        translateX(-100%);
    }

}


/* =====================================================
   SOCIAL BUTTONS
===================================================== */

.social-box{

    margin-top:18px;

    background:var(--panel);

    border-radius:16px;

    padding:12px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

    color:var(--yellow);

    font-size:15px;

    box-shadow:var(--shadow);

}

.social-btn{

    background:var(--blue);

    color:#fff;

    padding:
    9px 12px;

    border-radius:9px;

    white-space:nowrap;

    font-size:14px;

}


/* =====================================================
   DASHBOARD
===================================================== */

.stats{

    margin-top:20px;

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:10px;

}

.stat{

    background:var(--panel);

    border-radius:15px;

    padding:14px 8px;

    text-align:center;

    box-shadow:var(--shadow);

}

.stat i{

    color:var(--yellow);

    font-size:20px;

}

.stat-number{

    font-size:22px;

    font-weight:bold;

}

.stat-label{

    color:var(--muted);

    font-size:12px;

}


/* =====================================================
   SEARCH
===================================================== */

.search-area{

    margin-top:20px;

    display:flex;

    gap:8px;

}

.search-box{

    flex:1;

    position:relative;

}

.search-box i{

    position:absolute;

    left:14px;

    top:50%;

    transform:
    translateY(-50%);

    color:#8c99a3;

}

.search-box input{

    width:100%;

    height:48px;

    border:0;

    outline:0;

    border-radius:13px;

    background:var(--panel);

    color:var(--text);

    padding:
    0 15px 0 42px;

    font-size:15px;

}

.sort-btn{

    width:48px;

    height:48px;

    border:0;

    border-radius:13px;

    background:var(--green);

    color:#fff;

    font-size:18px;

}


/* =====================================================
   PAGE TITLE
===================================================== */

.page-title{

    text-align:center;

    color:var(--yellow);

    font-size:25px;

    margin:
    25px 0 15px;

}


/* =====================================================
   AGENT LIST
===================================================== */

.agent-list{

    display:flex;

    flex-direction:column;

    gap:10px;

}


/* AGENT CARD */

.agent-card{

    background:var(--card);

    border-radius:16px;

    padding:13px;

    box-shadow:
    0 5px 18px
    rgba(0,0,0,.12);

    border:
    1px solid
    rgba(255,255,255,.03);

}


.agent-top{

    display:flex;

    align-items:center;

    gap:10px;

}


.avatar{

    width:52px;

    height:52px;

    border-radius:50%;

    background:
    var(--green);

    color:#125073;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-shrink:0;

    font-size:22px;

    overflow:hidden;

}

.avatar img{

    width:100%;

    height:100%;

    object-fit:cover;

}


.agent-info{

    flex:1;

    min-width:0;

}

.agent-name{

    font-size:16px;

    font-weight:600;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.agent-role{

    color:var(--muted);

    font-size:12px;

}


.status{

    display:inline-flex;

    align-items:center;

    gap:4px;

    color:var(--online);

    font-size:11px;

}

.status-dot{

    width:6px;

    height:6px;

    background:var(--online);

    border-radius:50%;

}


.id{

    background:var(--green);

    color:#183b16;

    border-radius:9px;

    padding:
    5px 8px;

    font-size:12px;

    font-weight:bold;

    text-align:center;

}

.id small{

    display:block;

    font-size:8px;

}


.rating{

    margin-top:10px;

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.stars{

    color:var(--yellow);

    letter-spacing:1px;

    font-size:14px;

}

.rating-text{

    color:var(--muted);

    font-size:11px;

}


/* =====================================================
   ACTIONS
===================================================== */

.actions{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:7px;

    margin-top:12px;

}

.action{

    border:0;

    border-radius:9px;

    padding:9px 4px;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:3px;

    font-size:10px;

    color:#fff;

}

.action i{

    font-size:17px;

}

.whatsapp{

    background:#20b957;

}

.facebook{

    background:#1877f2;

}

.view{

    background:#556b7d;

}

.report{

    background:var(--red);

}


/* =====================================================
   PHONE
===================================================== */

.phone-row{

    margin-top:10px;

    background:
    rgba(0,0,0,.12);

    border-radius:9px;

    padding:8px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:6px;

}

.phone{

    font-size:12px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

}

.copy{

    background:var(--green);

    border:0;

    color:#fff;

    border-radius:7px;

    padding:5px 8px;

    font-size:10px;

}


/* =====================================================
   NO RESULT
===================================================== */

.no-result{

    text-align:center;

    padding:40px 10px;

    color:var(--muted);

}

.no-result i{

    font-size:45px;

    margin-bottom:10px;

    color:var(--yellow);

}


/* =====================================================
   PROCESS
===================================================== */

.process{

    margin-top:25px;

    background:var(--panel);

    border-radius:17px;

    padding:20px 12px;

}

.process h2{

    color:var(--yellow);

    text-align:center;

    font-size:22px;

    font-weight:500;

    margin-bottom:15px;

}

.process-row{

    background:var(--card);

    border-radius:13px;

    padding:13px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

}

.domain{

    font-size:15px;

}

.active{

    color:var(--online);

    font-size:13px;

}

.visit{

    background:var(--green);

    color:#fff;

    border-radius:8px;

    padding:7px 12px;

    font-size:13px;

}


/* =====================================================
   SUPPORT
===================================================== */

.support{

    position:fixed;

    left:20px;

    bottom:20px;

    z-index:100;

    background:var(--green);

    color:white;

    border:0;

    border-radius:13px;

    padding:
    11px 15px;

    font-size:17px;

    font-weight:bold;

    box-shadow:
    0 5px 20px
    rgba(0,0,0,.25);

}


/* =====================================================
   BOTTOM NAV MOBILE
===================================================== */

.bottom-nav{

    display:none;

}

@media(max-width:600px){

    .bottom-nav{

        position:fixed;

        left:0;

        right:0;

        bottom:0;

        height:62px;

        background:
        #063e6b;

        z-index:90;

        display:grid;

        grid-template-columns:
        repeat(5,1fr);

        border-top:
        1px solid
        rgba(255,255,255,.1);

    }

    .bottom-btn{

        background:none;

        border:0;

        color:#b9c5cd;

        font-size:10px;

        display:flex;

        flex-direction:column;

        align-items:center;

        justify-content:center;

        gap:3px;

    }

    .bottom-btn i{

        font-size:18px;

    }

    .bottom-btn.active{

        color:var(--yellow);

    }

    body{

        padding-bottom:75px;

    }

}


/* =====================================================
   MODAL
===================================================== */

.modal{

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,.7);

    display:none;

    align-items:flex-end;

    justify-content:center;

    z-index:200;

    padding:10px;

}

.modal.show{

    display:flex;

}

.modal-box{

    width:min(100%,500px);

    background:var(--panel);

    border-radius:
    20px 20px 10px 10px;

    padding:22px;

    animation:
    slideUp .25s ease;

}

@keyframes slideUp{

    from{
        transform:
        translateY(100%);
    }

    to{
        transform:
        translateY(0);
    }

}

.modal-close{

    float:right;

    background:none;

    border:0;

    color:var(--text);

    font-size:22px;

}

.modal-profile{

    text-align:center;

    padding:10px;

}

.modal-profile .avatar{

    width:80px;

    height:80px;

    margin:auto;

    font-size:32px;

}

.modal-name{

    font-size:22px;

    margin-top:10px;

}

.modal-role{

    color:var(--muted);

}

.modal-info{

    margin-top:18px;

    display:grid;

    gap:8px;

}

.info{

    background:var(--card);

    padding:10px;

    border-radius:9px;

    display:flex;

    justify-content:space-between;

}

.modal-actions{

    margin-top:15px;

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:8px;

}

.modal-actions button{

    border:0;

    border-radius:10px;

    padding:11px;

    color:#fff;

}


/* =====================================================
   TOAST
===================================================== */

.toast{

    position:fixed;

    left:50%;

    bottom:85px;

    transform:
    translateX(-50%)
    translateY(20px);

    background:#111;

    color:#fff;

    padding:
    10px 17px;

    border-radius:9px;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:500;

    font-size:13px;

}

.toast.show{

    opacity:1;

    transform:
    translateX(-50%)
    translateY(0);

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:601px){

    .nav{

        grid-template-columns:
        repeat(7,1fr);

        border-radius:20px;

    }

    .agent-list{

        display:grid;

        grid-template-columns:
        repeat(2,1fr);

        gap:12px;

    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-width:380px){

    .header{

        height:160px;

    }

    .logo{

        font-size:42px;

    }

    .logo-sub{

        top:108px;

        font-size:13px;

    }

    .header-btn{

        top:58px;

        font-size:27px;

    }

    .header-btn.left{

        left:15px;

    }

    .header-btn.right{

        right:15px;

    }

    .nav{

        gap:18px 4px;

        padding:20px 5px;

    }

    .nav-btn{

        font-size:13px;

    }

    .nav-btn i{

        font-size:17px;

    }

    .social-box{

        font-size:12px;

    }

    .social-btn{

        font-size:11px;

        padding:8px;

    }

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    text-align:center;

    padding:40px;

    color:var(--yellow);

}

.spinner{

    width:35px;

    height:35px;

    border:
    4px solid
    rgba(255,255,255,.2);

    border-top-color:
    var(--yellow);

    border-radius:50%;

    animation:
    spin .7s linear infinite;

    margin:auto auto 10px;

}

@keyframes spin{

    to{
        transform:
        rotate(360deg);
    }

}

</style>
</head>

function getAllAgents(){

/* =====================================================

===================================================== */

function avatar(agent){

if(agent.image){

return `

<div class="avatar">

<img
src="${agent.image}"
alt="${agent.name}">

</div>

`;

}

return `

<div class="avatar">

<i class="fa-solid fa-user"></i>

</div>

`;

===================================================== */

return `

</div>

/* =====================================================

===================================================== */

function createCards(list){

return list.map(agent=>`

<div
class="agent-card"
data-name="${agent.name.toLowerCase()}"
data-phone="${agent.phone}"
data-id="${agent.id}">


<div class="agent-top">


${avatar(agent)}


<div class="agent-info">

<div class="agent-name">

${agent.name}

</div>

<div class="agent-role">

${agent.role}

</div>

<div class="status">

<span class="status-dot"></span>

Active

</div>

</div>


<div class="id">

<small>ID</small>

${agent.id}

</div>


</div>



<div class="rating">

<div class="stars">

</div>

5.0 / 5.0

</div>

</div>

class="copy"

`<a

</div>

`;

}

.querySelectorAll(".nav-btn")
.forEach(btn=>
btn.classList.remove("active")
);

button.classList.add("active");

}

.innerHTML=homePage();

/* =====================================================
   SEARCH
===================================================== */

function searchAgents(){

const value=
document
.getElementById("search")
.value
.toLowerCase()
.trim();


const cards=
document.querySelectorAll(
".agent-card"
);


let found=0;


cards.forEach(card=>{

const text=
card.dataset.name
+
card.dataset.phone
+
card.dataset.id;


if(text.includes(value)){

card.style.display="block";

found++;

}

else{

card.style.display="none";

}

});


let no=
document.querySelector(".no-result");


if(!found && value){

if(!no){

no=document.createElement("div");

no.className="no-result";

no.innerHTML=`

<i class="fa-solid fa-face-frown"></i>

<br>

কোনো Agent পাওয়া যায়নি

`;

document
.getElementById("content")
.appendChild(no);

}

}

else if(no){

no.remove();

}

}



/* =====================================================
   SORT
===================================================== */

function sortAgents(){

if(!currentAgents.length){

showToast("আগে একটি List নির্বাচন করুন");

return;

}


currentAgents.sort((a,b)=>{

return ascending

?
a.name.localeCompare(b.name)
:
b.name.localeCompare(a.name);

});


ascending=!ascending;


const container=
document.getElementById("content");


const title=
container.querySelector(".page-title")
?.textContent || "";


container.innerHTML=
listPage(title,currentAgents);

showToast("List Sorted");

}

/* =====================================================

===================================================== */

function closeModal(event){

if(
!event ||
event.target.id==="modal"
){

document
.getElementById("modal")
.classList.remove("show");

}

}



/* =====================================================
   COPY
===================================================== */

function copyPhone(phone){

navigator
.clipboard
.writeText(phone)
.then(()=>{

showToast(
"Phone number copied"
);

})
.catch(()=>{

showToast(phone);

});

}

const ok=

" কে Report করতে চান?"
);

showToast(
"Report submitted"

}

}

block:"center"
});

},400);

}



/* =====================================================
   THEME
===================================================== */

function toggleTheme(){

document
.body
.classList
.toggle("light");


localStorage.setItem(
"theme",
document.body.classList.contains("light")
?
"light"
:
"dark"
);

}



/* LOAD THEME */

if(
localStorage.getItem("theme")
==="light"
){

document
.body
.classList
.add("light");

}



/* =====================================================
   BOTTOM NAV
===================================================== */

function bottomPage(page,button){

document
.querySelectorAll(".bottom-btn")
.forEach(btn=>
btn.classList.remove("active")
);

button.classList.add("active");


const navButton=
document.querySelector(
`.nav-btn[data-page="${page}"]`
);


changePage(
page,
navButton
);

}



/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

const toast=
document.getElementById("toast");

toast.textContent=message;

toast.classList.add("show");

clearTimeout(toastTimer);

toastTimer=
setTimeout(()=>{

toast.classList.remove("show");

},1800);

}



/* =====================================================
   START
===================================================== */

changePage(
"home",
document.querySelector(
'.nav-btn[data-page="home"]'
)
);
